name: Release

on:
  workflow_run:
    workflows: [Quality and release artifacts]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: [self-hosted, sophie]
    timeout-minutes: 45
    permissions:
      actions: read
      contents: write
    env:
      # Step conditions cannot read secrets, so resolve the signing decision here.
      # Without AMO keys the release carries an unsigned XPI.
      SIGN: ${{ secrets.AMO_JWT_ISSUER != '' && secrets.AMO_JWT_SECRET != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.21.0"
      - name: Require the successful current main revision
        id: source
        run: node scripts/release-ci.ts source
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: release-plan
          path: artifacts/release-plan
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate the tested release plan
        id: plan
        run: node scripts/release-ci.ts plan artifacts/release-plan/release-plan.json
        env:
          RELEASE_SOURCE: ${{ steps.source.outputs.source }}
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        if: steps.plan.outputs.version != ''
        with:
          name: release-extension
          path: artifacts/release
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install pinned release tooling
        if: steps.plan.outputs.version != ''
        run: npm ci
      - name: Submit the tested build to addons.mozilla.org
        if: steps.plan.outputs.version != '' && env.SIGN == 'true'
        run: |
          git archive --format=zip -o artifacts/source.zip HEAD
          # The listing, privacy policy and signed file can lag behind a human review. A review
          # that outlasts the wait is not a failure: the release ships without an XPI and
          # addons.mozilla.org publishes the version once it is approved.
          set +e
          npx web-ext sign --source-dir artifacts/release/dist --channel listed \
            --amo-metadata amo/metadata.json --upload-source-code artifacts/source.zip \
            --approval-timeout 1200000 --artifacts-dir artifacts/signed 2>&1 | tee artifacts/sign.log
          status=${PIPESTATUS[0]}
          set -e
          rm artifacts/release/*.xpi artifacts/release/SHA256SUMS
          if [ "$status" -ne 0 ]; then
            grep -q "Approval: timeout exceeded" artifacts/sign.log || exit "$status"
            echo "::notice::Submitted for review; the version will appear on addons.mozilla.org once approved."
          else
            # A fixed name keeps releases/latest/download/fastmail-alias-creator.xpi stable.
            cp artifacts/signed/*.xpi artifacts/release/fastmail-alias-creator.xpi
            (cd artifacts/release && sha256sum *.xpi > SHA256SUMS)
          fi
          node scripts/amo-listing.ts
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
      - name: Publish the tested extension
        if: steps.plan.outputs.version != ''
        run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_VERSION: ${{ steps.plan.outputs.version }}
          GIT_AUTHOR_NAME: Sam R
          GIT_AUTHOR_EMAIL: sam@technesci.co.uk
          GIT_COMMITTER_NAME: Sam R
          GIT_COMMITTER_EMAIL: sam@technesci.co.uk
